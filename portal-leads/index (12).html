<style>
:root{
  --azul:#009FDF; --azul-esc:#007CB0; --laranja:#E57623; --laranja-esc:#C45F12;
  --tinta:#12263F; --tinta-2:#475569; --suave:#64748B;
  --bg:#F2F6FA; --surf:#FFFFFF; --linha:#E3EAF2; --azul-claro:#EAF3FB; --laranja-claro:#FDECE0;
  --verde:#1E9E6A; --verde-claro:#E6F5EE; --cinza-claro:#F1F5F9;
  --r:14px; --sombra:0 1px 2px rgba(18,38,63,.06), 0 6px 20px rgba(18,38,63,.06);
  --sombra-alta:0 12px 40px rgba(18,38,63,.16);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:'Hanken Grotesk',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  background:var(--bg); color:var(--tinta); -webkit-font-smoothing:antialiased;
  font-size:15px; line-height:1.45; overflow-x:hidden;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:var(--azul-esc);text-decoration:none}
.hidden{display:none !important}

/* ---------- LOGIN ---------- */
#login{min-height:100dvh;display:grid;place-items:center;padding:24px;
  background:linear-gradient(160deg,#009FDF 0%,#007CB0 55%,#0A4C6A 100%)}
.login-card{width:100%;max-width:400px;background:var(--surf);border-radius:20px;padding:36px 30px 30px;
  box-shadow:var(--sombra-alta)}
.login-card img{width:168px;display:block;margin:0 auto 26px}
.login-card h1{font-size:19px;font-weight:700;margin:0 0 22px;text-align:center;letter-spacing:-.2px}
.campo{margin-bottom:14px}
.campo label{display:block;font-size:12.5px;font-weight:600;color:var(--suave);margin-bottom:6px;
  text-transform:uppercase;letter-spacing:.5px}
.campo input,.campo select,.campo textarea{width:100%;padding:12px 14px;border:1.5px solid var(--linha);
  border-radius:10px;background:var(--surf);transition:border-color .15s,box-shadow .15s}
.campo input:focus,.campo select:focus,.campo textarea:focus{outline:none;border-color:var(--azul);
  box-shadow:0 0 0 3px rgba(0,159,223,.15)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 20px;border-radius:10px;
  font-weight:700;letter-spacing:.2px;transition:transform .08s,background .15s,box-shadow .15s}
.btn:active{transform:translateY(1px)}
.btn-cta{background:var(--laranja);color:#fff;width:100%;box-shadow:0 4px 14px rgba(229,118,35,.32)}
.btn-cta:hover{background:var(--laranja-esc)}
.btn-ghost{border:1.5px solid var(--linha);color:var(--tinta-2);background:var(--surf);padding:9px 14px;font-weight:600}
.btn-ghost:hover{border-color:var(--azul);color:var(--azul-esc)}
.erro{color:#C0392B;font-size:13.5px;font-weight:600;margin:4px 0 12px;min-height:18px}

/* ---------- TOPBAR ---------- */
.topbar{position:sticky;top:0;z-index:40;background:var(--azul);color:#fff;
  padding:12px 20px;display:flex;align-items:center;gap:16px;box-shadow:0 2px 12px rgba(0,124,176,.28)}
.topbar img{height:26px;flex:0 0 auto}
.topbar .quem{margin-left:auto;display:flex;align-items:center;gap:12px;font-size:13.5px;min-width:0}
.topbar .nome{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:38vw}
.topbar .sair{border:1.5px solid rgba(255,255,255,.55);color:#fff;border-radius:9px;padding:6px 12px;
  font-size:13px;font-weight:600}
.topbar .sair:hover{background:rgba(255,255,255,.14)}
.sync{font-size:12px;font-weight:600;padding:4px 9px;border-radius:20px;background:rgba(255,255,255,.18)}
.sync.erro-sync{background:#FDECE0;color:#C45F12}

/* ---------- LAYOUT ---------- */
main{max-width:1320px;margin:0 auto;padding:22px 20px 80px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--surf);border:1px solid var(--linha);border-radius:var(--r);padding:14px 16px}
.kpi b{display:block;font-size:26px;font-weight:800;letter-spacing:-.5px;line-height:1.1}
.kpi span{font-size:12.5px;color:var(--suave);font-weight:600}
.kpi.dest b{color:var(--laranja)}
.kpi.azul b{color:var(--azul-esc)}

.toolbar{position:sticky;top:50px;z-index:30;background:var(--bg);padding:10px 0 12px;
  display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.busca{flex:1 1 260px;position:relative}
.busca input{width:100%;padding:11px 14px 11px 38px;border:1.5px solid var(--linha);border-radius:10px;background:var(--surf)}
.busca svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);opacity:.45}
.chips{display:flex;gap:7px;flex-wrap:wrap;min-width:0}
.chip-f{padding:8px 13px;border-radius:20px;border:1.5px solid var(--linha);background:var(--surf);
  font-size:13px;font-weight:600;color:var(--tinta-2);white-space:nowrap}
.chip-f:hover{border-color:var(--azul)}
.chip-f.on{background:var(--azul);border-color:var(--azul);color:#fff}
.chip-f.on.laranja{background:var(--laranja);border-color:var(--laranja)}
select.am{padding:9px 12px;border:1.5px solid var(--linha);border-radius:10px;background:var(--surf);font-weight:600}

/* ---------- CARDS ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px;align-items:start}
.card{background:var(--surf);border:1px solid var(--linha);border-radius:var(--r);padding:16px 16px 10px;
  box-shadow:var(--sombra);display:flex;flex-direction:column;border-top:3px solid var(--linha);min-width:0}
.card *{min-width:0}
.card h3{overflow-wrap:anywhere}
.card[data-grupo="1"]{border-top-color:var(--laranja)}
.card[data-grupo="2"]{border-top-color:var(--azul)}
.card[data-grupo="3"]{border-top-color:#C7D7E6}
.card[data-grupo="4"]{border-top-color:#CBD5E1}
.card h3{margin:0;font-size:16.5px;font-weight:800;letter-spacing:-.3px;line-height:1.25}
.card .linha-topo{display:flex;align-items:flex-start;gap:10px;justify-content:space-between}
.tag{font-size:11px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;padding:4px 8px;border-radius:6px;white-space:nowrap}
.tag.g1{background:var(--laranja-claro);color:var(--laranja-esc)}
.tag.g2{background:var(--azul-claro);color:var(--azul-esc)}
.tag.g3{background:var(--cinza-claro);color:var(--suave)}
.tag.g4{background:var(--cinza-claro);color:#94A3B8}
.meta{font-size:12.5px;color:var(--suave);font-weight:600;margin:7px 0 0}
.gancho{margin:11px 0 4px;background:var(--azul-claro);border-radius:10px;padding:10px 12px;
  font-size:13.5px;line-height:1.4;color:#0B3A54;display:flex;gap:9px}
.gancho svg{flex:0 0 16px;margin-top:2px}
.gancho b{font-weight:700}
.contatos{list-style:none;margin:10px 0 0;padding:0;border-top:1px solid var(--linha)}
.contato{width:100%;display:flex;align-items:center;gap:10px;padding:11px 4px;text-align:left;
  border-bottom:1px solid var(--linha);transition:background .12s}
.contatos li:last-child .contato{border-bottom:0}
.contato:hover{background:var(--azul-claro)}
.contato .info{flex:1;min-width:0;display:block}
.contato .n{display:block;font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.contato .c{display:block;font-size:12px;color:var(--suave);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{font-size:11px;font-weight:700;padding:4px 9px;border-radius:20px;white-space:nowrap}
.badge.novo{background:var(--cinza-claro);color:#94A3B8}
.badge.andamento{background:var(--azul-claro);color:var(--azul-esc)}
.badge.reuniao{background:var(--laranja-claro);color:var(--laranja-esc)}
.badge.ganho{background:var(--verde-claro);color:var(--verde)}
.badge.fim{background:#F1F5F9;color:#94A3B8}
.pin{width:7px;height:7px;border-radius:50%;flex:0 0 7px}
.pin.quente{background:var(--laranja)}
.pin.morno{background:var(--azul)}
.pin.frio{background:#CBD5E1}
.vazio{text-align:center;padding:60px 20px;color:var(--suave);font-weight:600}

/* ---------- DRAWER ---------- */
.fundo{position:fixed;inset:0;background:rgba(18,38,63,.45);z-index:50;opacity:0;pointer-events:none;
  transition:opacity .2s}
.fundo.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100dvh;width:min(460px,100%);background:var(--surf);z-index:60;
  transform:translateX(100%);transition:transform .25s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;
  box-shadow:var(--sombra-alta)}
.drawer.on{transform:translateX(0)}
.drawer header{padding:18px 20px 14px;border-bottom:1px solid var(--linha);display:flex;gap:12px;align-items:flex-start}
.drawer header h2{margin:0;font-size:18px;font-weight:800;letter-spacing:-.3px}
.drawer header p{margin:3px 0 0;font-size:13px;color:var(--suave);font-weight:600}
.fechar{margin-left:auto;font-size:22px;line-height:1;color:var(--suave);padding:2px 6px;border-radius:8px}
.fechar:hover{background:var(--cinza-claro)}
.drawer .corpo{flex:1;overflow-y:auto;padding:16px 20px 20px}
.acoes{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
.acao{border:1.5px solid var(--linha);border-radius:10px;padding:10px 4px;display:flex;flex-direction:column;
  align-items:center;gap:5px;font-size:11px;font-weight:700;color:var(--tinta-2)}
.acao:hover{border-color:var(--azul);color:var(--azul-esc);background:var(--azul-claro)}
.acao.off{opacity:.35;pointer-events:none}
.bloco{background:var(--azul-claro);border-radius:12px;padding:13px 14px;margin-bottom:12px}
.bloco .rot{font-size:11px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--azul-esc);
  margin-bottom:6px;display:flex;align-items:center;gap:6px}
.bloco p{margin:0;font-size:14px;line-height:1.45;color:#0B3A54}
.bloco.abrid{background:var(--laranja-claro)}
.bloco.abrid .rot{color:var(--laranja-esc)}
.bloco.abrid p{color:#7A3B08;font-style:italic}
.copiar{margin-left:auto;font-size:11px;font-weight:700;color:inherit;opacity:.75;text-transform:none;letter-spacing:0}
.copiar:hover{opacity:1;text-decoration:underline}
.sinais{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.sinal{font-size:11.5px;font-weight:700;padding:4px 9px;border-radius:6px;background:var(--cinza-claro);color:var(--tinta-2)}
.form-tit{font-size:12px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--suave);
  margin:18px 0 10px;padding-top:14px;border-top:1px solid var(--linha)}
.canais{display:flex;gap:7px;flex-wrap:wrap}
.canal{padding:8px 12px;border:1.5px solid var(--linha);border-radius:20px;font-size:13px;font-weight:600;color:var(--tinta-2)}
.canal.on{background:var(--azul);border-color:var(--azul);color:#fff}
textarea{min-height:78px;resize:vertical}
.dupla{display:grid;grid-template-columns:1fr 150px;gap:10px}
.drawer footer{padding:12px 20px;border-top:1px solid var(--linha);background:var(--surf)}
.hist{margin-top:14px;font-size:12.5px;color:var(--suave);font-weight:600}
.hist ul{list-style:none;margin:8px 0 0;padding:0}
.hist li{padding:7px 0;border-top:1px dashed var(--linha);color:var(--tinta-2);font-weight:500}
.ok-toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--tinta);
  color:#fff;padding:11px 20px;border-radius:30px;font-weight:600;font-size:14px;z-index:90;opacity:0;
  transition:opacity .2s,transform .2s;pointer-events:none}
.ok-toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.aviso{background:var(--laranja-claro);color:#7A3B08;border-radius:10px;padding:10px 14px;font-size:13px;
  font-weight:600;margin-bottom:14px}
@media(max-width:760px){
  main{padding:16px 14px 70px}
  .toolbar{top:50px;gap:8px}
  .grid{grid-template-columns:minmax(0,1fr)}
  .dupla{grid-template-columns:1fr}
  .kpi{padding:12px 13px}
  .kpi b{font-size:21px}
  .kpis{grid-template-columns:repeat(4,1fr);gap:8px}
  .kpi span{font-size:11.5px}
  .topbar{padding:10px 14px;gap:10px}
  .topbar img{height:22px}
  .sync{display:none}
  .chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none;
    padding-bottom:2px;margin:0 -14px;padding-left:14px;padding-right:14px}
  .chips::-webkit-scrollbar{display:none}
  .busca{flex:1 1 100%}
  .acoes{grid-template-columns:repeat(4,1fr)}
}
@media(max-width:420px){
  .kpis{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->

/* =====================================================================
   2. ESTADO
   ===================================================================== */
const LS_CONTA = "engemon.portal.conta";
const LS_REG   = "engemon.portal.registros";
const LS_FILA  = "engemon.portal.fila";

let conta = null;
let registros = {};          // id do contato -> registro
let fila = [];               // registros pendentes de envio
let atual = null;            // contato aberto no drawer
let filtro = {q:"", grupo:"todos", pendentes:false, am:"todos"};

const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));

/* =====================================================================
   3. LOGIN
   ===================================================================== */
$("#form-login").addEventListener("submit", e => {
  e.preventDefault();
  const email = $("#in-email").value.trim().toLowerCase();
  const senha = $("#in-senha").value;
  const chave = email.split("@")[0];
  const c = CONTAS.find(x => x.email === email || x.email.split("@")[0] === chave);
  if (!c || c.senha !== senha) {
    $("#erro-login").textContent = "E-mail ou senha incorretos.";
    return;
  }
  entrar(c);
});

function entrar(c){
  conta = c;
  localStorage.setItem(LS_CONTA, c.email);
  $("#login").classList.add("hidden");
  $("#app").classList.remove("hidden");
  $("#quem-nome").textContent = c.nome;
  filtro.am = "todos";
  montarSelectAM();
  carregarLocal();
  render();
  sincronizar();
}

$("#btn-sair").addEventListener("click", () => {
  localStorage.removeItem(LS_CONTA);
  conta = null;
  $("#app").classList.add("hidden");
  $("#login").classList.remove("hidden");
  $("#in-senha").value = "";
  $("#erro-login").textContent = "";
});

/* =====================================================================
   4. DADOS DO ACCOUNT
   ===================================================================== */
function empresasDaConta(){
  let lista = DADOS.empresas;
  if (conta.perfil !== "admin") lista = lista.filter(e => e.am === conta.am);
  else if (filtro.am !== "todos") lista = lista.filter(e => e.am === filtro.am);
  return lista;
}

function montarSelectAM(){
  const sel = $("#sel-am");
  if (conta.perfil !== "admin"){ sel.classList.add("hidden"); return; }
  const ams = Array.from(new Set(DADOS.empresas.map(e => e.am))).sort();
  sel.innerHTML = '<option value="todos">Todos os accounts</option>' +
    ams.map(a => `<option value="${esc(a)}">${esc(a)}</option>`).join("");
  sel.classList.remove("hidden");
  sel.onchange = () => { filtro.am = sel.value; render(); };
}

/* =====================================================================
   5. PERSISTENCIA
   ===================================================================== */
function carregarLocal(){
  try { registros = JSON.parse(localStorage.getItem(LS_REG) || "{}"); } catch(e){ registros = {}; }
  try { fila = JSON.parse(localStorage.getItem(LS_FILA) || "[]"); } catch(e){ fila = []; }
}
function salvarLocal(){
  localStorage.setItem(LS_REG, JSON.stringify(registros));
  localStorage.setItem(LS_FILA, JSON.stringify(fila));
}

function marcarSync(txt, erro){
  const el = $("#sync");
  el.textContent = txt;
  el.classList.toggle("erro-sync", !!erro);
}

async function sincronizar(){
  if (!API_URL){ marcarSync("Modo local"); return; }
  marcarSync("Sincronizando");
  try {
    await enviarFila();
    const alvo = conta.perfil === "admin" ? "todos" : conta.email;
    const url = API_URL + "?acao=registros&conta=" + encodeURIComponent(alvo) +
                "&senha=" + encodeURIComponent(conta.senha);
    const r = await fetch(url);
    const j = await r.json();
    if (j && j.ok && j.registros){
      j.registros.forEach(reg => {
        const local = registros[reg.id];
        if (!local || (reg.atualizadoEm || "") >= (local.atualizadoEm || "")) registros[reg.id] = reg;
      });
      if (j.leads && j.leads.empresas && j.leads.empresas.length){
        DADOS.empresas = j.leads.empresas;
      }
      salvarLocal();
      render();
      marcarSync("Sincronizado");
    } else { marcarSync("Modo local"); }
  } catch(e){ marcarSync("Offline, salvo no navegador", true); }
}

async function enviarFila(){
  if (!API_URL || !fila.length) return;
  const pendentes = fila.slice();
  for (const reg of pendentes){
    try {
      await fetch(API_URL, {
        method:"POST",
        headers:{"Content-Type":"text/plain;charset=utf-8"},
        body: JSON.stringify(Object.assign({acao:"salvar", senha:conta.senha}, reg))
      });
      fila = fila.filter(x => !(x.id === reg.id && x.atualizadoEm === reg.atualizadoEm));
    } catch(e){ break; }
  }
  salvarLocal();
}

/* =====================================================================
   6. RENDER
   ===================================================================== */
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, m =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m])); }

function statusDe(id){ return (registros[id] && registros[id].status) || "Sem registro"; }
function clsStatus(v){ const s = STATUS.find(x => x.v === v); return s ? s.cls : "novo"; }

function render(){
  const lista = empresasDaConta();
  const q = filtro.q.toLowerCase().trim();

  const visiveis = lista.map(emp => {
    const contatos = emp.contatos.filter(ct => {
      if (filtro.grupo !== "todos" && String(ct.grupo) !== filtro.grupo) return false;
      if (filtro.pendentes && statusDe(ct.id) !== "Sem registro") return false;
      if (q){
        const alvo = (emp.nome + " " + ct.nome + " " + ct.cargo + " " + ct.gancho).toLowerCase();
        if (!alvo.includes(q)) return false;
      }
      return true;
    });
    return contatos.length ? Object.assign({}, emp, {contatos}) : null;
  }).filter(Boolean);

  // KPIs
  const todosContatos = lista.flatMap(e => e.contatos);
  const comReg = todosContatos.filter(c => statusDe(c.id) !== "Sem registro").length;
  const reunioes = todosContatos.filter(c => String(statusDe(c.id)).indexOf("Reunião") === 0).length;
  $("#kpis").innerHTML = `
    <div class="kpi"><b>${lista.length}</b><span>Empresas</span></div>
    <div class="kpi"><b>${todosContatos.length}</b><span>Contatos</span></div>
    <div class="kpi azul"><b>${comReg}</b><span>Com registro</span></div>
    <div class="kpi dest"><b>${reunioes}</b><span>Reuniões</span></div>`;

  // Cards
  $("#grid").innerHTML = visiveis.map(cardHTML).join("");
  $("#vazio").classList.toggle("hidden", visiveis.length > 0);

  $$(".contato").forEach(b => b.onclick = () => abrir(b.dataset.emp, b.dataset.id));
}

function cardHTML(emp){
  const metas = [];
  if (emp.faturamento) metas.push(esc(emp.faturamento));
  if (emp.colaboradores) metas.push(esc(emp.colaboradores) + " colaboradores");
  if (emp.eventos.length) metas.push(esc(emp.eventos.join(" + ")));
  const rotulos = {1:"Prioridade 1", 2:"Prioridade 2", 3:"Fila geral", 4:"Baixa prioridade"};
  return `
  <article class="card" data-grupo="${emp.grupo}">
    <div class="linha-topo">
      <h3>${esc(emp.nome)}</h3>
      <span class="tag g${emp.grupo}">${rotulos[emp.grupo]}</span>
    </div>
    <p class="meta">${metas.join(" &middot; ")}</p>
    <div class="gancho">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#007CB0" stroke-width="2.4"
           stroke-linecap="round"><path d="M13 2 4.5 13H11l-1 9 9-11.5H12.5L13 2z"/></svg>
      <span>${esc(emp.gancho)}${emp.ganchoUnico ? "" : " <b>Veja o gancho de cada contato abaixo.</b>"}</span></div>
    <ul class="contatos">
      ${emp.contatos.map(ct => {
        const st = statusDe(ct.id);
        return `<li><button class="contato" data-emp="${esc(emp.id)}" data-id="${esc(ct.id)}">
          <span class="pin ${ct.temp}"></span>
          <span class="info">
            <span class="n">${esc(ct.nome)}</span>
            <span class="c">${esc(ct.cargo || ct.nivel)}</span>
          </span>
          <span class="badge ${clsStatus(st)}">${esc(st === "Sem registro" ? ct.nivel : st)}</span>
        </button></li>`;
      }).join("")}
    </ul>
  </article>`;
}

/* filtros */
$("#in-busca").addEventListener("input", e => { filtro.q = e.target.value; render(); });
$("#chips-grupo").addEventListener("click", e => {
  const b = e.target.closest("[data-grupo]"); if (!b) return;
  $$("#chips-grupo .chip-f").forEach(x => x.classList.remove("on"));
  b.classList.add("on");
  filtro.grupo = b.dataset.grupo;
  render();
});
$("#chip-pendentes").addEventListener("click", e => {
  filtro.pendentes = !filtro.pendentes;
  e.target.classList.toggle("on", filtro.pendentes);
  e.target.classList.toggle("laranja", filtro.pendentes);
  render();
});

/* =====================================================================
   7. DRAWER
   ===================================================================== */
function acharContato(empId, ctId){
  const emp = DADOS.empresas.find(e => e.id === empId);
  if (!emp) return null;
  const ct = emp.contatos.find(c => c.id === ctId);
  return ct ? {emp, ct} : null;
}

function abrir(empId, ctId){
  const achado = acharContato(empId, ctId);
  if (!achado) return;
  atual = achado;
  const {emp, ct} = achado;
  const reg = registros[ct.id] || {};

  $("#d-nome").textContent = ct.nome;
  $("#d-cargo").textContent = [ct.cargo, emp.nome].filter(Boolean).join(" · ");

  // acoes
  const tel = (ct.celular || "").replace(/\D/g, "");
  const telZap = tel.length >= 10 && tel.indexOf("55") !== 0 ? "55" + tel : tel;
  link($("#a-mail"), ct.email ? "mailto:" + ct.email + "?subject=" + encodeURIComponent("Engemon IT") : "");
  link($("#a-zap"),  tel ? "https://wa.me/" + telZap + "?text=" + encodeURIComponent(ct.abridor) : "");
  link($("#a-tel"),  tel ? "tel:+" + telZap : "");
  const inUrl = ct.linkedin ? (ct.linkedin.indexOf("http") === 0 ? ct.linkedin : "https://" + ct.linkedin) : "";
  link($("#a-in"), inUrl);

  $("#d-sinais").innerHTML = [ct.nivel].concat(ct.sinais || [])
    .map(s => `<span class="sinal">${esc(s)}</span>`).join("");
  $("#d-gancho").textContent = ct.gancho;
  $("#d-abridor").textContent = ct.abridor;

  $("#d-status").innerHTML = STATUS.map(s =>
    `<option value="${esc(s.v)}"${(reg.status || "Sem registro") === s.v ? " selected" : ""}>${esc(s.v)}</option>`).join("");
  const canais = reg.canais || [];
  $("#d-canais").innerHTML = CANAIS.map(c =>
    `<button type="button" class="canal${canais.indexOf(c) >= 0 ? " on" : ""}" data-canal="${esc(c)}">${esc(c)}</button>`).join("");
  $$("#d-canais .canal").forEach(b => b.onclick = () => b.classList.toggle("on"));
  $("#d-obs").value = reg.obs || "";
  $("#d-passo").value = reg.proximoPasso || "";
  $("#d-data").value = reg.dataProximo || "";

  const hist = $("#d-hist");
  if (reg.atualizadoEm){
    hist.classList.remove("hidden");
    hist.innerHTML = `Último registro por ${esc(reg.contaNome || reg.conta || "")} em ${esc(dataBR(reg.atualizadoEm))}`;
  } else hist.classList.add("hidden");

  $("#drawer").classList.add("on");
  $("#fundo").classList.add("on");
  $("#drawer").setAttribute("aria-hidden", "false");
}

function link(el, href){
  if (href){ el.href = href; el.classList.remove("off"); }
  else { el.removeAttribute("href"); el.classList.add("off"); }
}

function fechar(){
  $("#drawer").classList.remove("on");
  $("#fundo").classList.remove("on");
  $("#drawer").setAttribute("aria-hidden", "true");
  atual = null;
}
$("#btn-fechar").onclick = fechar;
$("#fundo").onclick = fechar;
document.addEventListener("keydown", e => { if (e.key === "Escape") fechar(); });

$$(".copiar").forEach(b => b.onclick = () => {
  if (!atual) return;
  const txt = b.dataset.copiar === "gancho" ? atual.ct.gancho : atual.ct.abridor;
  navigator.clipboard.writeText(txt).then(() => toast("Copiado"));
});

/* =====================================================================
   8. SALVAR
   ===================================================================== */
$("#btn-salvar").onclick = async () => {
  if (!atual) return;
  const {emp, ct} = atual;
  const reg = {
    id: ct.id,
    conta: conta.email,
    contaNome: conta.nome,
    am: emp.am,
    empresa: emp.nome,
    contato: ct.nome,
    cargo: ct.cargo,
    email: ct.email,
    celular: ct.celular,
    grupo: ct.grupo,
    status: $("#d-status").value,
    canais: $$("#d-canais .canal.on").map(b => b.dataset.canal),
    obs: $("#d-obs").value.trim(),
    proximoPasso: $("#d-passo").value.trim(),
    dataProximo: $("#d-data").value,
    atualizadoEm: new Date().toISOString()
  };
  registros[ct.id] = reg;
  fila.push(reg);
  salvarLocal();
  render();
  fechar();
  toast("Registro salvo");
  if (API_URL){ marcarSync("Enviando"); await enviarFila(); marcarSync(fila.length ? "Pendente de envio" : "Sincronizado", fila.length > 0); }
};

function toast(t){
  const el = $("#toast");
  el.textContent = t;
  el.classList.add("on");
  setTimeout(() => el.classList.remove("on"), 1800);
}
function dataBR(iso){
  try { return new Date(iso).toLocaleDateString("pt-BR", {day:"2-digit", month:"2-digit", year:"numeric"}); }
  catch(e){ return iso; }
}

/* =====================================================================
   9. START
   ===================================================================== */
(function(){
  const salvo = localStorage.getItem(LS_CONTA);
  if (salvo){
    const c = CONTAS.find(x => x.email === salvo);
    if (c) entrar(c);
  }
})();
</script>
